name: Publish

on:
  release:
    types:
      - published
  # A published release runs the workflow file stored on the tag. Tags from
  # before the OIDC publish fix still fail if you only recreate the release.
  # Dispatch this workflow from main and pass the tag to publish that commit
  # with the fixed workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (for example, v0.8.0)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      # Do not set setup-node registry-url. With it set and no real token,
      # setup-node writes _authToken=${NODE_AUTH_TOKEN} and exports the
      # placeholder NODE_AUTH_TOKEN, which skips npm's OIDC trusted-publisher
      # exchange. npm already defaults to https://registry.npmjs.org.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: |
          TAG_NAME="${{ github.event.release.tag_name || inputs.tag }}"
          PACKAGE_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"

          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must use vX.Y.Z format; got $TAG_NAME" >&2
            exit 1
          fi

          if [ "$TAG_NAME" != "v$PACKAGE_VERSION" ]; then
            echo "release tag $TAG_NAME does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Run release-confidence suite
        run: npm run test:release

      - name: Dry-run pack
        run: npm pack --dry-run

      - name: Print publish metadata
        run: |
          PACKAGE_NAME="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).name")"
          PACKAGE_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          REPOSITORY_URL="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).repository.url")"

          echo "package name: $PACKAGE_NAME"
          echo "package version: $PACKAGE_VERSION"
          echo "repository.url: $REPOSITORY_URL"

      - name: Check if version is already published
        id: npm-version
        run: |
          PACKAGE_NAME="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).name")"
          PACKAGE_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip publish when version already exists
        if: steps.npm-version.outputs.already_published == 'true'
        run: |
          PACKAGE_NAME="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).name")"
          PACKAGE_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published on npm; skipping publish"

      # Node 22's bundled npm is often older than 11.5.1, which is the
      # first release that exchanges a GitHub Actions OIDC token with npm.
      - name: Install npm CLI for trusted publishing
        if: steps.npm-version.outputs.already_published != 'true'
        run: |
          npm install -g npm@latest
          version="$(npm --version)"
          echo "npm version: ${version}"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const supported =
              major > 11 ||
              (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!supported) {
              console.error(
                `npm ${process.argv[1]} is below 11.5.1; OIDC trusted publishing requires npm >= 11.5.1`,
              );
              process.exit(1);
            }
          ' "${version}"

      - name: Publish to npm
        if: steps.npm-version.outputs.already_published != 'true'
        run: |
          # Drop any leftover auth so npm uses the GitHub Actions OIDC
          # trusted publisher instead of a classic token.
          unset NODE_AUTH_TOKEN
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            grep -v '_authToken' "$npmrc" > "${npmrc}.tmp" || true
            mv "${npmrc}.tmp" "$npmrc"
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            PACKAGE_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
            # npm rejects a dist-tag that is a semver range, so the package
            # version itself cannot be the tag. Prefix it. The release stays
            # installable as <name>@<version> and does not move latest.
            npm publish --provenance --access public --tag "version-${PACKAGE_VERSION}"
          else
            npm publish --provenance --access public
          fi
