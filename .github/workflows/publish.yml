name: Publish

on:
  release:
    types:
      - published
  # A published release runs the workflow file stored on the tag. Tags from
  # before the OIDC publish fix still fail if you only recreate the release.
  # Dispatch this workflow from main and pass the tag to publish that commit
  # with the fixed workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (for example, v0.8.0)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      # Do not set setup-node registry-url. With it set and no real token,
      # setup-node writes _authToken=${NODE_AUTH_TOKEN} and exports the
      # placeholder NODE_AUTH_TOKEN, which skips npm's OIDC trusted-publisher
      # exchange. npm already defaults to https://registry.npmjs.org.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: |
          TAG_NAME="${{ github.event.release.tag_name || inputs.tag }}"
          PACKAGE_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"

          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must use vX.Y.Z format; got $TAG_NAME" >&2
            exit 1
          fi

          if [ "$TAG_NAME" != "v$PACKAGE_VERSION" ]; then
            echo "release tag $TAG_NAME does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Run release-confidence suite
        run: npm run test:release

      - name: Dry-run pack
        run: npm pack --dry-run

      - name: Print publish metadata
        run: |
          PACKAGE_NAME="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).name")"
          PACKAGE_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          REPOSITORY_URL="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).repository.url")"

          echo "package name: $PACKAGE_NAME"
          echo "package version: $PACKAGE_VERSION"
          echo "repository.url: $REPOSITORY_URL"

      - name: Check if version is already published
        id: npm-version
        run: |
          PACKAGE_NAME="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).name")"
          PACKAGE_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip publish when version already exists
        if: steps.npm-version.outputs.already_published == 'true'
        run: |
          PACKAGE_NAME="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).name")"
          PACKAGE_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published on npm; skipping publish"

      # Node 22's bundled npm is often older than 11.5.1, which is the
      # first release that exchanges a GitHub Actions OIDC token with npm.
      - name: Install npm CLI for trusted publishing
        if: steps.npm-version.outputs.already_published != 'true'
        run: |
          npm install -g npm@latest
          version="$(npm --version)"
          echo "npm version: ${version}"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const supported =
              major > 11 ||
              (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!supported) {
              console.error(
                `npm ${process.argv[1]} is below 11.5.1; OIDC trusted publishing requires npm >= 11.5.1`,
              );
              process.exit(1);
            }
          ' "${version}"

      - name: Publish to npm
        if: steps.npm-version.outputs.already_published != 'true'
        run: |
          # Drop any leftover auth so npm uses the GitHub Actions OIDC
          # trusted publisher instead of a classic token.
          unset NODE_AUTH_TOKEN
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            grep -v '_authToken' "$npmrc" > "${npmrc}.tmp" || true
            mv "${npmrc}.tmp" "$npmrc"
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            PACKAGE_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
            # npm rejects a dist-tag that is a semver range, so the package
            # version itself cannot be the tag. Prefix it. The release stays
            # installable as <name>@<version> and does not move latest.
            npm publish --provenance --access public --tag "version-${PACKAGE_VERSION}"
          else
            npm publish --provenance --access public
          fi

  # Formula lives in synthesiseng/homebrew-tap (Formula/gitrole.rb), not this
  # repo. Bump it only after a published release. workflow_dispatch backfills
  # must not move the tap. Tap writes use a short-lived release App token
  # scoped to homebrew-tap with contents: write only. GITHUB_TOKEN stays
  # read-only here. App authentication failure stops this job after npm
  # publication; this job does not publish to npm again.
  brew-bump:
    name: Bump Homebrew formula
    needs: [publish]
    if: github.event_name == 'release' && github.event.action == 'published' && github.event.release.prerelease == false && !contains(github.event.release.tag_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Create Homebrew tap App token
        id: tap-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: synthesiseng
          repositories: homebrew-tap
          permission-contents: write

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve package version
        id: version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"

          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must use vX.Y.Z format; got $TAG_NAME" >&2
            exit 1
          fi

          if [ "$TAG_NAME" != "v$PACKAGE_VERSION" ]; then
            echo "release tag $TAG_NAME does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi

          echo "version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"

      # Publish can return before the registry serves the tarball. Retry, then
      # hash the bytes Homebrew will install. A version that was already on
      # npm still gets a formula bump; a missing tarball does not.
      - name: Download npm tarball and compute sha256
        id: tarball
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          url="https://registry.npmjs.org/gitrole/-/gitrole-${PACKAGE_VERSION}.tgz"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT

          for attempt in 1 2 3 4 5; do
            if curl -fsSL -o "$tmp" "$url"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "npm tarball is not available at ${url}." >&2
              echo "brew-bump runs only after publish succeeds, including when that version was already on npm. The registry did not serve the tarball." >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done

          if ! gzip -t "$tmp"; then
            echo "Download from ${url} is not a gzip tarball." >&2
            exit 1
          fi

          sha256="$(sha256sum "$tmp" | awk '{print $1}')"
          if ! [[ "$sha256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "sha256sum did not return 64 hex characters" >&2
            exit 1
          fi

          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"

      - name: Check out Homebrew tap
        uses: actions/checkout@v5
        with:
          repository: synthesiseng/homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          path: homebrew-tap
          fetch-depth: 1
          persist-credentials: true

      - name: Update Formula/gitrole.rb
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          TARBALL_URL: ${{ steps.tarball.outputs.url }}
          TARBALL_SHA256: ${{ steps.tarball.outputs.sha256 }}
        run: node .github/scripts/bump-homebrew-formula.mjs homebrew-tap/Formula/gitrole.rb

      # Push straight to the tap default branch, same as a brew bump bot.
      # The token's actor must be allowed to push there.
      - name: Commit and push formula bump
        working-directory: homebrew-tap
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if git diff --quiet -- Formula/gitrole.rb; then
            echo "Formula/gitrole.rb unchanged; nothing to push (see formula update result)"
            exit 0
          fi

          ruby -c Formula/gitrole.rb
          git add Formula/gitrole.rb
          git commit -m "chore(gitrole): bump formula to ${PACKAGE_VERSION}"
          branch="$(git symbolic-ref --short HEAD)"
          git push origin "HEAD:${branch}"
